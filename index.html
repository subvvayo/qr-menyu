<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Cafe - QR Menyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: linear-gradient(to bottom, rgba(24, 24, 27, 0.78), rgba(24, 24, 27, 0.92)), 
                              url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-white antialiased min-h-screen pb-36">

    <!-- Estetik Sarlavha -->
    <header class="bg-zinc-900/80 backdrop-blur-md border-b border-white/10 sticky top-0 z-40 px-3 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center gap-2">
            <!-- Kafe Logosi -->
            <div class="flex items-center gap-2 shrink-0">
                <span class="text-xl bg-amber-500/20 p-1.5 rounded-xl border border-amber-500/30">☕</span>
                <div>
                    <h1 class="font-bold text-sm tracking-tight text-white leading-none">Aura Cafe</h1>
                    <span id="txt-subtitle" class="text-[10px] text-zinc-400">QR Menyu</span>
                </div>
            </div>

            <!-- Yaqqol ko'rinib turuvchi 3 ta til tugmasi + Stol -->
            <div class="flex items-center gap-1.5">
                <div class="flex bg-zinc-800/90 p-0.5 rounded-xl border border-white/15">
                    <button onclick="setLanguage('uz')" id="btn-uz" class="px-2 py-1 rounded-lg text-[10px] font-bold transition bg-amber-500 text-zinc-950">
                        UZB
                    </button>
                    <button onclick="setLanguage('cyr')" id="btn-cyr" class="px-2 py-1 rounded-lg text-[10px] font-bold transition text-zinc-300 hover:text-white">
                        КИРИЛ
                    </button>
                    <button onclick="setLanguage('ru')" id="btn-ru" class="px-2 py-1 rounded-lg text-[10px] font-bold transition text-zinc-300 hover:text-white">
                        РУС
                    </button>
                </div>

                <button onclick="openTableModal()" id="table-badge" class="bg-white/10 hover:bg-white/20 border border-white/15 text-amber-400 px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition cursor-pointer shrink-0">
                    📍 Stol
                </button>
            </div>
        </div>
    </header>

    <!-- Asosiy Kontent -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Toast Xabarnoma -->
        <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4 w-max max-w-[90%]">
            <div id="toast-bg" class="bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-sm font-medium border border-white/15">
                <span id="toast-icon">✅</span>
                <span id="toast-text">Amaliyot bajarildi</span>
            </div>
        </div>

        <!-- Tezkor Harakatlar -->
        <div class="grid grid-cols-2 gap-3 pt-1">
            <button onclick="callService('🔔 Ofitsiantni chaqirish')" class="group bg-gradient-to-br from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-amber-500/20 transition-all flex flex-col items-center justify-center gap-1 border border-white/15">
                <span class="text-2xl group-hover:scale-110 transition-transform">🔔</span>
                <span id="txt-call-waiter" class="text-xs tracking-wide">Ofitsiant chaqirish</span>
            </button>
            <button onclick="callService('🧾 Hisobni so\'rash (Chek)')" class="group bg-white/10 hover:bg-white/15 backdrop-blur-md active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1 border border-white/15">
                <span class="text-2xl group-hover:scale-110 transition-transform">🧾</span>
                <span id="txt-ask-check" class="text-xs tracking-wide">Hisobni so'rash</span>
            </button>
        </div>

        <!-- Menyu Bo'limi -->
        <div class="space-y-3.5">
            <div class="flex justify-between items-center px-1">
                <h2 id="txt-menu-title" class="text-base font-bold text-white tracking-tight">🍽 Asosiy Menyu</h2>
                <span id="txt-menu-desc" class="text-xs text-zinc-400">Tanlang va buyurtma bering</span>
            </div>

            <!-- Taomlar Ro'yxati -->
            <div id="menu-items-container" class="space-y-3.5"></div>
        </div>
    </main>

    <!-- Stol Raqamini So'rash Oynasi (Modal) -->
    <div id="table-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-zinc-900 border border-white/15 rounded-3xl p-6 max-w-xs w-full shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-2xl mx-auto border border-amber-500/30">
                🪑
            </div>
            <div>
                <h3 id="modal-title" class="text-lg font-bold text-white">Stol raqamingiz?</h3>
                <p id="modal-desc" class="text-xs text-zinc-400 mt-1">Buyurtma va ofitsiant sizni topishi uchun stol raqamini kiriting</p>
            </div>
            <input type="number" id="modal-table-input" placeholder="4" min="1" max="100"
                   class="w-full bg-zinc-800 border border-white/15 rounded-xl px-4 py-3 text-center text-white font-bold text-lg focus:outline-none focus:border-amber-500">
            <div class="grid grid-cols-2 gap-2.5 pt-1">
                <button onclick="closeTableModal()" id="modal-cancel-btn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold py-2.5 rounded-xl text-xs transition">
                    Bekor qilish
                </button>
                <button onclick="confirmTable()" id="modal-confirm-btn" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg">
                    Tasdiqlash ✓
                </button>
            </div>
        </div>
    </div>

    <!-- Pastki Savatcha Paneli -->
    <div id="cart-container" class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-xl border-t border-white/15 p-4 shadow-2xl transition-transform duration-300 translate-y-full z-40 rounded-t-3xl">
        <div class="max-w-md mx-auto space-y-3">
            <div class="flex justify-between items-center">
                <h3 id="cart-title" class="font-bold text-white text-sm">🛒 Sizning savatchangiz</h3>
                <span id="total-price" class="text-amber-400 font-bold text-sm">0 so'm</span>
            </div>
            
            <div id="cart-items" class="space-y-2 max-h-40 overflow-y-auto text-xs pr-1"></div>

            <button onclick="sendOrder()" id="cart-send-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-zinc-950 font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-sm">
                Buyurtmani yuborish 🚀
            </button>
        </div>
    </div>

    <!-- JavaScript Qismi -->
    <script>
        const BOT_TOKEN = "9253111920:AAEhDaKcjs9InrRqOgpwdF-gS9U8-w-4m7A";
        const CHAT_ID = "8305010615"; // Botingiz admin bo'lgan kanal yoki shaxsiy ID

        let currentLang = 'uz';
        let tableNum = null;
        let pendingAction = null;
        let cart = {};
