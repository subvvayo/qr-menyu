<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menyu - Kafe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold">☕ Bizning Kafe</h1>
        <div id="table-badge" class="bg-indigo-700 px-3 py-1 rounded-full text-sm font-semibold">
            Stol: Aniqlanmoqda...
        </div>
    </header>

    <!-- Asosiy qism -->
    <main class="max-w-md mx-auto p-4 pb-24">
        
        <!-- Tezkor tugmalar -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="sendAction('Ofitsiantni chaqirish')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                🛎️ Ofitsiantni chaqirish
            </button>
            <button onclick="sendAction('Hisobni so‘rash (Chek)')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                💳 Hisobni so‘rash
            </button>
        </div>

        <h2 class="text-lg font-bold text-gray-800 mb-3">📋 Taomlar Menyu</h2>

        <!-- Taomlar ro'yxati -->
        <div id="menu-list" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800">Osh (Milliy)</h3>
                    <p class="text-indigo-600 font-semibold text-sm">35 000 so'm</p>
                </div>
                <button onclick="addToCart('Osh (Milliy)', 35000)" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200 transition">+</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800">Manti (1 dona)</h3>
                    <p class="text-indigo-600 font-semibold text-sm">6 000 so'm</p>
                </div>
                <button onclick="addToCart('Manti (1 dona)', 6000)" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200 transition">+</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800">Koka-Kola 0.5L</h3>
                    <p class="text-indigo-600 font-semibold text-sm">8 000 so'm</p>
                </div>
                <button onclick="addToCart('Koka-Kola 0.5L', 8000)" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200 transition">+</button>
            </div>
        </div>
    </main>

    <!-- Savatcha Paneli -->
    <div id="cart-panel" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg hidden max-w-md mx-auto rounded-t-2xl">
        <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-gray-700">Buyurtma: <span id="cart-count">0</span> ta</span>
            <span class="font-bold text-indigo-600 text-lg" id="cart-total">0 so'm</span>
        </div>
        <button onclick="sendOrder()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition">
            Buyurtmani tasdiqlash 🚀
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('stol') || '1';
        document.getElementById('table-badge').innerText = `Stol: ${tableNumber}`;

        let cart = [];

        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const panel = document.getElementById('cart-panel');
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');

            let totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            let totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            countEl.innerText = totalCount;
            totalEl.innerText = totalPrice.toLocaleString() + " so'm";

            if (totalCount > 0) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }
const BOT_TOKEN = "9253111920:AAEhDaKcjs9InrRqOgpwdF-gS9U8-w-4m7A";
const CHAT_ID = "8305010615"; // O'zingizning shaxsiy ID raqamingiz

        async function sendTelegramMessage(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            try {
                let response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
                
                let data = await response.json();
                if (data.ok) {
                    alert("✅ So'rovingiz ofitsiantlarga yuborildi!");
                } else {
                    alert("❌ Xatolik: " + (data.description || "Noma'lum xatolik"));
                }
            } catch (error) {
                alert("❌ Tarmoq xatosi! Internetni tekshiring.");
                console.error(error);
            }
        }

        function sendAction(actionType) {
            let message = `🚨 *DIQQAT! STOL #${tableNumber}*\n\nHolat: *${actionType}*`;
            sendTelegramMessage(message);
        }

        function sendOrder() {
            let itemsText = cart.map(i => `▪️ ${i.name} x ${i.qty} — ${(i.price * i.qty).toLocaleString()} so'm`).join('\n');
            let totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            let message = `🛒 *YANGI BUYURTMA | STOL #${tableNumber}*\n\n${itemsText}\n\n💰 *Jami: ${totalPrice.toLocaleString()} so'm*`;
            
            sendTelegramMessage(message);
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
