<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menyu & Service - Kafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen pb-20">

    <!-- Estetik Sarlavha (Header) -->
    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200 sticky top-0 z-50 px-4 py-3.5 flex justify-between items-center shadow-xs">
        <div class="flex items-center gap-2">
            <span class="text-2xl">☕</span>
            <h1 class="font-bold text-lg tracking-tight text-stone-900">Aura Cafe</h1>
        </div>
        <div id="table-badge" class="bg-stone-900 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide shadow-sm">
            Stol: Aniqlanmoqda...
        </div>
    </header>

    <!-- Asosiy Kontent -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Xabarnoma (Toast Notification) - Yashirin turadi, chaqirilganda chiqadi -->
        <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
            <div id="toast-bg" class="bg-stone-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium">
                <span id="toast-icon">✅</span>
                <span id="toast-text">So'rovingiz yuborildi!</span>
            </div>
        </div>

        <!-- Tezkor Harakatlar (Ofitsiant va Hisob) -->
        <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="sendAction('🔔 Ofitsiantni chaqirish')" class="group bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-sm transition-all flex flex-col items-center justify-center gap-1">
                <span class="text-xl group-hover:scale-110 transition-transform">🔔</span>
                <span class="text-xs">Ofitsiant chaqirish</span>
            </button>
            <button onclick="sendAction('🧾 Hisobni so\'rash (Chek)')" class="group bg-stone-900 hover:bg-stone-800 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-sm transition-all flex flex-col items-center justify-center gap-1">
                <span class="text-xl group-hover:scale-110 transition-transform">🧾</span>
                <span class="text-xs">Hisobni so'rash</span>
            </button>
        </div>

        <!-- Menyu Bo'limi -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-base font-bold text-stone-900 tracking-tight">🍽 Asosiy Menyu</h2>
                <span class="text-xs text-stone-400 font-medium">Mazali taomlar</span>
            </div>

            <!-- Taom 1 -->
            <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-xs flex justify-between items-center transition hover:border-amber-400/50">
                <div class="space-y-0.5">
                    <h3 class="font-bold text-stone-800 text-sm">Osh (Milliy)</h3>
                    <p class="text-amber-600 font-semibold text-xs">35 000 so'm</p>
                </div>
                <button onclick="orderItem('Osh (Milliy)', 35000)" class="bg-stone-100 hover:bg-amber-500 hover:text-white text-stone-800 font-bold w-9 h-9 rounded-xl flex items-center justify-center transition text-lg">+</button>
            </div>

            <!-- Taom 2 -->
            <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-xs flex justify-between items-center transition hover:border-amber-400/50">
                <div class="space-y-0.5">
                    <h3 class="font-bold text-stone-800 text-sm">Manti (1 dona)</h3>
                    <p class="text-amber-600 font-semibold text-xs">6 000 so'm</p>
                </div>
                <button onclick="orderItem('Manti (1 dona)', 6000)" class="bg-stone-100 hover:bg-amber-500 hover:text-white text-stone-800 font-bold w-9 h-9 rounded-xl flex items-center justify-center transition text-lg">+</button>
            </div>

            <!-- Taom 3 -->
            <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-xs flex justify-between items-center transition hover:border-amber-400/50">
                <div class="space-y-0.5">
                    <h3 class="font-bold text-stone-800 text-sm">Koka-Kola 0.5L</h3>
                    <p class="text-amber-600 font-semibold text-xs">8 000 so'm</p>
                </div>
                <button onclick="orderItem('Koka-Kola 0.5L', 8000)" class="bg-stone-100 hover:bg-amber-500 hover:text-white text-stone-800 font-bold w-9 h-9 rounded-xl flex items-center justify-center transition text-lg">+</button>
            </div>
        </div>
    </main>

    <!-- JavaScript Qismi -->
    <script>
        const BOT_TOKEN = "9253111920:AAEhDaKcjs9InrRqOgpwdF-gS9U8-w-4m7A";
        const CHAT_ID = "@onlinekafe_bot"; // So'ralgan kanal/bot manzili

        // Stol raqamini aniqlash
        let urlParams = new URLSearchParams(window.location.search);
        let stolNum = urlParams.get('stol');

        if (!stolNum) {
            stolNum = prompt("Iltimos, o'tirgan stolingiz raqamini kiriting (masalan: 1, 2, 3):", "1");
            if (!stolNum || stolNum.trim() === "") {
                stolNum = "1";
            }
        }

        document.getElementById('table-badge').innerText = "Stol: " + stolNum;

        // Estetik Xabarnomani (Toast) chiqarish funksiyasi
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastBg = document.getElementById('toast-bg');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            toastText.innerText = message;
            if (isError) {
                toastBg.className = "bg-rose-600 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium";
                toastIcon.innerText = "❌";
            } else {
                toastBg.className = "bg-stone-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium";
                toastIcon.innerText = "✨";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 3000);
        }

        // Telegramga yuborish
        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            const data = {
                chat_id: CHAT_ID,
                text: text,
                parse_mode: "Markdown"
            };

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.ok) {
                    showToast("So'rovingiz ofitsiantga yetkazildi!");
                } else {
                    showToast("Xatolik: " + result.description, true);
                }
            })
            .catch(error => {
                showToast("Tarmoq xatoligi yuz berdi!", true);
            });
        }

        function sendAction(actionName) {
            let message = `🚨 *Yangi xabar!*\n\n📍 *Stol:* ${stolNum}\n⚡ *Holat:* ${actionName}`;
            sendToTelegram(message);
        }

        function orderItem(itemName, price) {
            let message = `🛒 *Yangi buyurtma!*\n\n📍 *Stol:* ${stolNum}\n🍽 *Taom:* ${itemName}\n💰 *Narxi:* ${price.toLocaleString()} so'm`;
            sendToTelegram(message);
        }
    </script>
</body>
</html>
