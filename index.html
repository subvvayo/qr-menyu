<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menyu - Kafe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Sarlavha -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold">☕ Bizning Kafe</h1>
        <div id="table-badge" class="bg-indigo-700 px-3 py-1 rounded-full text-sm font-semibold">
            Stol: Aniqlanmoqda...
        </div>
    </header>

    <!-- Asosiy qism -->
    <main class="max-w-md mx-auto p-4 pb-24">
        
        <!-- Tezkor tugmalar -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="sendAction('🔔 Ofitsiantni chaqirish')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                🔔 Ofitsiantni chaqirish
            </button>
            <button onclick="sendAction('🧾 Hisobni so\'rash (Chek)')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                🧾 Hisobni so'rash
            </button>
        </div>

        <h2 class="text-lg font-bold text-gray-800 mb-3">📋 Taomlar Menyu</h2>

        <!-- Taomlar ro'yxati -->
        <div class="space-y-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800">Osh (Milliy)</h3>
                    <p class="text-indigo-600 font-semibold text-sm">35 000 so'm</p>
                </div>
                <button onclick="orderItem('Osh (Milliy)', 35000)" class="bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold w-10 h-10 rounded-xl flex items-center justify-center text-xl">+</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800">Manti (1 dona)</h3>
                    <p class="text-indigo-600 font-semibold text-sm">6 000 so'm</p>
                </div>
                <button onclick="orderItem('Manti (1 dona)', 6000)" class="bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold w-10 h-10 rounded-xl flex items-center justify-center text-xl">+</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800">Koka-Kola 0.5L</h3>
                    <p class="text-indigo-600 font-semibold text-sm">8 000 so'm</p>
                </div>
                <button onclick="orderItem('Koka-Kola 0.5L', 8000)" class="bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold w-10 h-10 rounded-xl flex items-center justify-center text-xl">+</button>
            </div>
        </div>
    </main>

    <!-- JavaScript qismi -->
    <script>
        const BOT_TOKEN = "9253111920:AAEhDaKcjs9InrRqOgpwdF-gS9U8-w-4m7A";
        const CHAT_ID = "@angren_kafe_orders"; // O'zingizning kanal yoki guruh ID raqamingiz

        // Sayt ochilganda stol raqamini aniqlash yoki so'rash
        let urlParams = new URLSearchParams(window.location.search);
        let stolNum = urlParams.get('stol');

        if (!stolNum) {
            // Agar havolada stol ko'rsatilmagan bo'lsa, oynacha chiqib so'raydi
            stolNum = prompt("Iltimos, o'tirgan stolingiz raqamini kiriting (masalan: 1, 2, 3):", "1");
            if (!stolNum || stolNum.trim() === "") {
                stolNum = "Noma'lum";
            }
        }

        // Ekranga stol raqamini chiqarish
        document.getElementById('table-badge').innerText = "Stol: " + stolNum;

        // Telegramga xabar yuborish funksiyasi
        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            const data = {
                chat_id: CHAT_ID,
                text: text,
                parse_mode: "Markdown"
            };

            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.ok) {
                    alert("✅ So'rovingiz ofitsiantga yuborildi!");
                } else {
                    alert("❌ Xatolik yuz berdi: " + result.description);
                }
            })
            .catch(error => {
                alert("❌ Tarmoq xatoligi: " + error);
            });
        }

        // Ofitsiant chaqirish yoki chek so'rash tugmasi bosilganda
        function sendAction(actionName) {
            let message = `🚨 *Yangi xabar!*\n\n📍 *Stol:* ${stolNum}\n⚡ *Holat:* ${actionName}`;
            sendToTelegram(message);
        }

        // Taom qo'shganda
        function orderItem(itemName, price) {
            let message = `🛒 *Yangi buyurtma!*\n\n📍 *Stol:* ${stolNum}\n🍽 *Taom:* ${itemName}\n💰 *Narxi:* ${price.toLocaleString()} so'm`;
            sendToTelegram(message);
        }
    </script>
</body>
</html>
