<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Cafe - QR Menyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen pb-32">

    <!-- Estetik Sarlavha -->
    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40 px-4 py-3.5 flex justify-between items-center shadow-xs">
        <div class="flex items-center gap-2">
            <span class="text-2xl">☕</span>
            <h1 class="font-bold text-lg tracking-tight text-stone-900">Aura Cafe</h1>
        </div>
        <div id="table-badge" class="bg-stone-200 text-stone-700 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">
            Stol: Hali tanlanmadi
        </div>
    </header>

    <!-- Asosiy Kontent -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Toast Xabarnoma -->
        <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
            <div id="toast-bg" class="bg-stone-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium">
                <span id="toast-icon">✨</span>
                <span id="toast-text">Amaliyot bajarildi</span>
            </div>
        </div>

        <!-- Tezkor Harakatlar (Ofitsiant va Hisob) -->
        <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="callService('🔔 Ofitsiantni chaqirish')" class="group bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-sm transition-all flex flex-col items-center justify-center gap-1">
                <span class="text-xl group-hover:scale-110 transition-transform">🔔</span>
                <span class="text-xs">Ofitsiant chaqirish</span>
            </button>
            <button onclick="callService('🧾 Hisobni so\'rash (Chek)')" class="group bg-stone-900 hover:bg-stone-800 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-sm transition-all flex flex-col items-center justify-center gap-1">
                <span class="text-xl group-hover:scale-110 transition-transform">🧾</span>
                <span class="text-xs">Hisobni so'rash</span>
            </button>
        </div>

        <!-- Menyu Bo'limi -->
        <div class="space-y-3">
            <h2 class="text-base font-bold text-stone-900 tracking-tight px-1">🍽 Asosiy Menyu</h2>

            <!-- Taom 1 -->
            <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-xs flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-stone-800 text-sm">Osh (Milliy)</h3>
                    <p class="text-amber-600 font-semibold text-xs">35 000 so'm</p>
                </div>
                <button onclick="addToCart('Osh (Milliy)', 35000)" class="bg-stone-100 hover:bg-amber-500 hover:text-white text-stone-800 font-bold w-9 h-9 rounded-xl flex items-center justify-center transition text-lg">+</button>
            </div>

            <!-- Taom 2 -->
            <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-xs flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-stone-800 text-sm">Manti (1 dona)</h3>
                    <p class="text-amber-600 font-semibold text-xs">6 000 so'm</p>
                </div>
                <button onclick="addToCart('Manti (1 dona)', 6000)" class="bg-stone-100 hover:bg-amber-500 hover:text-white text-stone-800 font-bold w-9 h-9 rounded-xl flex items-center justify-center transition text-lg">+</button>
            </div>

            <!-- Taom 3 -->
            <div class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-xs flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-stone-800 text-sm">Koka-Kola 0.5L</h3>
                    <p class="text-amber-600 font-semibold text-xs">8 000 so'm</p>
                </div>
                <button onclick="addToCart('Koka-Kola 0.5L', 8000)" class="bg-stone-100 hover:bg-amber-500 hover:text-white text-stone-800 font-bold w-9 h-9 rounded-xl flex items-center justify-center transition text-lg">+</button>
            </div>
        </div>
    </main>

    <!-- Pastki Savatcha Paneli (Faqat taom tanlanganda chiqadi) -->
    <div id="cart-container" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-stone-200 p-4 shadow-lg transition-transform duration-300 translate-y-full z-40">
        <div class="max-w-md mx-auto space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-stone-900 text-sm">🛒 Sizning buyurtmangiz</h3>
                <span id="total-price" class="text-amber-600 font-bold text-sm">0 so'm</span>
            </div>
            
            <!-- Tanlangan taomlar ro'yxati (1x, 2x bo'lib chiqadi) -->
            <div id="cart-items" class="space-y-2 max-h-40 overflow-y-auto text-xs">
                <!-- JavaScript orqali to'ldiriladi -->
            </div>

            <button onclick="sendOrder()" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3 rounded-xl shadow-md transition active:scale-95 text-sm">
                Buyurtmani yuborish 🚀
            </button>
        </div>
    </div>

    <!-- JavaScript Qismi -->
    <script>
        const BOT_TOKEN = "9253111920:AAEhDaKcjs9InrRqOgpwdF-gS9U8-w-4m7A";
        const CHAT_ID = "@onlinekafe_bot";

        let tableNum = null;
        let cart = {}; // Taomlarni saqlash uchun obyekt

        // Stol raqamini so'rab olish funksiyasi
        function getTableNumber() {
            if (!tableNum) {
                let input = prompt("Iltimos, o'tirgan stolingiz raqamini kiriting (masalan: 1, 2, 3):", "1");
                if (input && input.trim() !== "") {
                    tableNum = input.trim();
                    document.getElementById('table-badge').innerText = "Stol: " + tableNum;
                    document.getElementById('table-badge').className = "bg-stone-900 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide shadow-sm";
                }
            }
            return tableNum;
        }

        // Toast xabarnoma
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastBg = document.getElementById('toast-bg');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            toastText.innerText = message;
            toastBg.className = isError 
                ? "bg-rose-600 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium"
                : "bg-stone-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium";
            toastIcon.innerText = isError ? "❌" : "✨";

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 3000);
        }

        // Savatchaga qo'shish
        function addToCart(name, price) {
            if (!cart[name]) {
                cart[name] = { price: price, qty: 0 };
            }
            cart[name].qty += 1;
            updateCartUI();
        }

        // Savatchadan kamaytirish yoki o'chirish
        function changeQty(name, amount) {
            if (cart[name]) {
                cart[name].qty += amount;
                if (cart[name].qty <= 0) {
                    delete cart[name];
                }
            }
            updateCartUI();
        }

        // Savatcha dizaynini yangilash (1x, 2x qilib ko'rsatish)
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-container');
            const cartItemsEl = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('total-price');

            cartItemsEl.innerHTML = '';
            let totalSum = 0;
            let hasItems = false;

            for (let name in cart) {
                hasItems = true;
                let item = cart[name];
                let itemTotal = item.price * item.qty;
                totalSum += itemTotal;

                let row = document.createElement('div');
                row.className = "flex justify-between items-center bg-stone-50 p-2 rounded-xl border border-stone-200";
                row.innerHTML = `
                    <span class="font-medium text-stone-800">${name}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-amber-600 font-bold">${item.qty}x (${itemTotal.toLocaleString()} so'm)</span>
                        <div class="flex items-center gap-1 bg-white border border-stone-200 rounded-lg overflow-hidden">
                            <button onclick="changeQty('${name}', -1)" class="px-2 py-0.5 text-stone-600 hover:bg-stone-100 font-bold">-</button>
                            <button onclick="changeQty('${name}', 1)" class="px-2 py-0.5 text-stone-600 hover:bg-stone-100 font-bold">+</button>
                        </div>
                    </div>
                `;
                cartItemsEl.appendChild(row);
            }

            totalPriceEl.innerText = totalSum.toLocaleString() + " so'm";

            if (hasItems) {
                cartContainer.classList.remove('translate-y-full');
            } else {
                cartContainer.classList.add('translate-y-full');
            }
        }

        // Telegramga yuborish umumiy funksiyasi
        function sendToTelegram(messageText) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const data = {
                chat_id: CHAT_ID,
                text: messageText,
                parse_mode: "Markdown"
            };

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                if (res.ok) {
                    showToast("Muvaffaqiyatli yuborildi!");
                } else {
                    showToast("Xatolik: " + res.description, true);
                }
            })
            .catch(() => {
                showToast("Tarmoq xatoligi!", true);
            });
        }

        // Ofitsiant chaqirish yoki hisob so'rash
        function callService(actionName) {
            let stol = getTableNumber();
            if (!stol) return; // Agar stol kiritmasa yubormaydi

            let message = `🚨 *Yangi xabar!*\n\n📍 *Stol:* ${stol}\n⚡ *Holat:* ${actionName}`;
            sendToTelegram(message);
        }

        // Buyurtmani yuborish
        function sendOrder() {
            let stol = getTableNumber();
            if (!stol) return;

            let message = `🛒 *Yangi buyurtma!*\n\n📍 *Stol:* ${stol}\n\n`;
            let totalSum = 0;

            for (let name in cart) {
                let item = cart[name];
                let itemTotal = item.price * item.qty;
                totalSum += itemTotal;
                message += `▪️ ${name} — *${item.qty}x* (${itemTotal.toLocaleString()} so'm)\n`;
            }

            message += `\n💰 *Umumiy summa:* *${totalSum.toLocaleString()} so'm*`;

            sendToTelegram(message);

            // Buyurtma ketgandan keyin savatchani tozalash
            cart = {};
            updateCartUI();
        }
    </script>
</body>
</html>
